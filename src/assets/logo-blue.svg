<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F6DF5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D5BD9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8FF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F6DF5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 外圆背景 -->
  <circle cx="100" cy="100" r="88" fill="#F0F2FF"/>

  <!-- 主六边形 -->
  <g transform="translate(100, 100)">
    <path d="M0,-52 L45,-26 L45,26 L0,52 L-45,26 L-45,-26 Z"
          fill="url(#grad1)"
          opacity="0.12"/>
    <path d="M0,-48 L41.5,-24 L41.5,24 L0,48 L-41.5,24 L-41.5,-24 Z"
          fill="url(#grad1)"
          opacity="0.2"/>

    <!-- 核心六边形 -->
    <path d="M0,-36 L31,-18 L31,18 L0,36 L-31,18 L-31,-18 Z"
          fill="url(#grad1)"/>

    <!-- 内部白色线条：数据层 -->
    <path d="M-20,-6 L0,-16 L20,-6"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.95"/>
    <path d="M-20,6 L0,-4 L20,6"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.95"/>
    <path d="M-20,18 L0,8 L20,18"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.95"/>

    <!-- 右侧连接点 -->
    <circle cx="42" cy="0" r="5" fill="url(#grad2)"/>
    <circle cx="-42" cy="0" r="5" fill="url(#grad2)"/>
    <circle cx="0" cy="-48" r="5" fill="url(#grad2)"/>
    <circle cx="0" cy="48" r="5" fill="url(#grad2)"/>
  </g>
</svg>
