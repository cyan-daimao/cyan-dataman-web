      };

    <style>
      /* Dify 悬浮按钮 - 默认隐藏，由页面 JS 控制显示 */
      #dify-chatbot-bubble-button {
        display: none !important;
        background: linear-gradient(135deg, #1890ff, #1C64F2) !important;
        width: auto !important;
        height: 44px !important;
        min-width: 44px !important;
        padding: 0 16px !important;
        border-radius: 22px !important;
        box-shadow: 0 4px 16px rgba(28, 100, 242, 0.35) !important;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        bottom: 24px !important;
        right: 24px !important;
        gap: 6px !important;
        align-items: center !important;
        justify-content: center !important;
      }
      #dify-chatbot-bubble-button::after {
        content: '智能问数';
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
      }
      #dify-chatbot-bubble-button:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 6px 24px rgba(28, 100, 242, 0.45) !important;
      }
      #dify-chatbot-bubble-button:active {
        transform: translateY(0) !important;
      }

      /* Dify 对话框窗口 */
      #dify-chatbot-bubble-window {
        width: 40rem !important;
        height: 48rem !important;
        border-radius: 16px !important;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15) !important;
        border: 1px solid rgba(0, 0, 0, 0.06) !important;
        overflow: hidden !important;
        bottom: 92px !important;
        right: 24px !important;
      }

      /* 移动端适配 */
      @media (max-width: 768px) {
        #dify-chatbot-bubble-window {
          width: calc(100vw - 48px) !important;
          height: 70vh !important;
          right: 24px !important;
          left: 24px !important;
        }
      }
    </style>
  </head>
